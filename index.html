<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파라파라나 춰야겠다</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
body{min-height:100vh;overflow:hidden}
#scene{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#message{padding:24px;text-align:center;font-size:clamp(28px,5vw,64px);font-weight:800;letter-spacing:.04em;opacity:0;animation:showMessage .7s ease forwards;text-shadow:0 0 18px rgba(255,255,255,.35)}
#imageWrap{display:none;width:min(900px,94vw);max-height:92vh;align-items:center;justify-content:center}
#animation{display:block;width:100%;max-height:92vh;object-fit:contain}
#scene.showanimation #message{display:none}
#scene.showanimation #imageWrap{display:flex;animation:showMessage .5s ease forwards}
@keyframes showMessage{from{opacity:0;transform:scale(.97);filter:blur(5px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
</style>
</head>
<body>
<main id="scene">
  <div id="message">파라파라나 춰야겠다</div>
  <div id="imageWrap">
    <img id="animation" src="parapara.webp" alt="파라파라나 춰야겠다 애니메이션">
  </div>
</main>
<script>
window.addEventListener('DOMContentLoaded', () => {
  // 문구를 약 2.6초 보여준 뒤, 자동 재생 버튼 없이 애니메이션 WebP를 표시한다.
  setTimeout(() => {
    document.getElementById('scene').classList.add('showanimation');
  }, 2600);
});
</script>
</body>
</html>
