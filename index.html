<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파라파라나 춰야겠다</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
body{min-height:100vh;overflow:hidden}
#scene{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#message{padding:24px;text-align:center;font-size:clamp(28px,5vw,64px);font-weight:800;letter-spacing:.04em;opacity:0;animation:showMessage .7s ease forwards;text-shadow:0 0 18px rgba(255,255,255,.35)}
#videoWrap{display:none;width:min(900px,94vw);max-height:92vh}
#vid{display:block;width:100%;max-height:92vh;object-fit:contain;background:#000}
#scene.playvideo #message{display:none}
#scene.playvideo #videoWrap{display:block;animation:showMessage .5s ease forwards}
@keyframes showMessage{from{opacity:0;transform:scale(.97);filter:blur(5px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
</style>
</head>
<body>
<main id="scene">
  <div id="message">파라파라나 춰야겠다</div>
  <div id="videoWrap">
    <video id="vid" controls autoplay playsinline preload="auto">
      <source src="파라파라.mp4" type="video/mp4">
      브라우저가 동영상을 재생할 수 없습니다.
    </video>
  </div>
</main>
<script>
(() => {
  const scene = document.getElementById('scene');
  const vid = document.getElementById('vid');

  // 문구를 먼저 보여주고, 2.6초 뒤 영상 화면으로 전환.
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      scene.classList.add('playvideo');
      // 영상 화면이 나타난 뒤 0.5초 후 자동 재생을 시도한다.
      setTimeout(() => {
        vid.play().catch(() => {
          // 브라우저가 소리 있는 자동 재생을 차단하면 재생 버튼으로 시작할 수 있다.
          vid.controls = true;
        });
      }, 500);
    }, 2600);
  });
})();
</script>
</body>
</html>
