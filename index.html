<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>파라파라나 춰야겠다</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
    }

    #screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    #message {
      font-family: sans-serif;
      font-size: clamp(28px, 5vw, 64px);
      font-weight: 800;
      text-align: center;
      padding: 24px;
    }

    #animation {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #screen.playing #message { display: none; }
    #screen.playing #animation { display: block; }
  </style>
</head>
<body>
  <main id="screen">
    <div id="message">파라파라나 춰야겠다</div>
    <img id="animation" src="./parapara.webp" alt="파라파라 애니메이션">
  </main>

  <script>
    const screen = document.getElementById("screen");
    const animation = document.getElementById("animation");
    const message = document.getElementById("message");

    animation.addEventListener("load", () => {
      setTimeout(() => {
        screen.classList.add("playing");
      }, 2600);
    });

    animation.addEventListener("error", () => {
      message.textContent = "이미지를 불러오지 못했어요.";
    });
  </script>
</body>
</html>
